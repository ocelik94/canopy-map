name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  key:
    name: Signing key
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-wolfi
      - run: melange keygen melange.rsa
      - uses: actions/upload-artifact@v7
        with:
          name: melange-key
          path: melange.rsa*
          retention-days: 1

  packages:
    name: Package (${{ matrix.arch }})
    needs: key
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/setup-wolfi

      - uses: actions/download-artifact@v8
        with:
          name: melange-key

      - name: melange build
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
          PACKAGES_ONLY: '1'
        run: scripts/build-image.sh

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          path: packages/
          retention-days: 1

  image:
    name: Scan and publish image
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-wolfi

      - uses: actions/download-artifact@v8
        with:
          name: melange-key

      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true

      - name: Build amd64 image for scanning
        run: |
          apko build apko.yaml canopy-map:scan canopy-map.tar --arch x86_64
          docker load < canopy-map.tar

      - name: Vulnerability scan (grype)
        uses: anchore/scan-action@v7.4.2
        with:
          image: canopy-map:scan-amd64
          fail-build: true
          severity-cutoff: high

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: publish
        name: Publish with apko
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags <<< "$TAGS"
          ref=$(apko publish apko.yaml "${tags[@]}" --arch x86_64,aarch64 --sbom-path sbom)
          echo "Published ${ref}"
          echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
          retention-days: 90

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags=(--prerelease --latest=false); fi
          gh release create "$TAG" sbom/* --verify-tag --generate-notes "${flags[@]}" \
            --notes "Container image: \`${IMAGE}:${TAG#v}\` (\`${DIGEST}\`)"
