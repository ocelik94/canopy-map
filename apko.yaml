contents:
  repositories:
    - https://packages.wolfi.dev/os
    - '@local ./packages'
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  packages:
    - ca-certificates-bundle
    - nodejs-24
    - wolfi-baselayout
    - canopy-map@local

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: '65532'

work-dir: /app

entrypoint:
  command: /usr/bin/node

cmd: build

environment:
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: '3000'
  PROTOCOL_HEADER: x-forwarded-proto
  HOST_HEADER: x-forwarded-host
  ADDRESS_HEADER: x-forwarded-for
  BODY_SIZE_LIMIT: 16M
  DATABASE_PATH: /data/canopy.db
  PHOTOS_DIR: /data/photos
  TILES_DIR: /tiles
  MIGRATIONS_DIR: /app/drizzle

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /data/photos
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tiles
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.title: Canopy
  org.opencontainers.image.description: Offline-first map of field-deployed acoustic recorders
  org.opencontainers.image.licenses: MIT
  org.opencontainers.image.source: https://github.com/ocelik94/canopy-map
